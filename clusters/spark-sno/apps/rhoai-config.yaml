# DSCI, DSC (MaaS Managed), HardwareProfile, Dashboard config
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhoai-config
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/joaquinfll/ztp-spark-maas.git
    targetRevision: main
    path: components/rhoai-config
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Operand CRDs appear only after the operator installs - keep retrying until they exist
      - SkipDryRunOnMissingResource=true
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
