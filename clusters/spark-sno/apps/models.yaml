# Qwen3.6-35B-A3B NVFP4 + MaaS tiers
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: models
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/joaquinfll/ztp-spark-maas.git
    targetRevision: main
    path: components/models
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Operand CRDs appear only after the operator installs - keep retrying until they exist
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
