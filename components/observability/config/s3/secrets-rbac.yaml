# RBAC for the S3 credentials Job (see secrets-job.yaml)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s3-secrets
  namespace: observability-s3
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: s3-secrets
  namespace: observability-s3
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: s3-secrets
  namespace: observability-s3
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: s3-secrets
subjects:
  - kind: ServiceAccount
    name: s3-secrets
    namespace: observability-s3
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: s3-secrets
  namespace: redhat-ods-monitoring
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: s3-secrets
  namespace: redhat-ods-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: s3-secrets
subjects:
  - kind: ServiceAccount
    name: s3-secrets
    namespace: observability-s3
