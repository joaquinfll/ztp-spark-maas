# Generates the S3 root credentials in-cluster (never stored in git) and creates:
#   versity-root   (observability-s3)       ROOT_ACCESS_KEY_ID / ROOT_SECRET_ACCESS_KEY for the gateway
#   usage-loki-s3  (redhat-ods-monitoring)  LokiStack object storage secret
# Idempotent: existing credentials are reused, so re-runs never rotate them.
apiVersion: batch/v1
kind: Job
metadata:
  name: s3-secrets
  namespace: observability-s3
spec:
  backoffLimit: 10
  template:
    spec:
      serviceAccountName: s3-secrets
      restartPolicy: OnFailure
      containers:
        - name: secrets
          image: quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:c732e0f5ae6b5d4d30062f367f4e10c5590f27c5342142db6eac8dcb6592a7a1
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              NS=observability-s3
              MON=redhat-ods-monitoring
              if oc get secret versity-root -n $NS >/dev/null 2>&1; then
                AK=$(oc get secret versity-root -n $NS -o jsonpath='{.data.ROOT_ACCESS_KEY_ID}' | base64 -d)
                SK=$(oc get secret versity-root -n $NS -o jsonpath='{.data.ROOT_SECRET_ACCESS_KEY}' | base64 -d)
                echo "versity-root exists - reusing credentials"
              else
                AK=$(head -c 64 /dev/urandom | base64 | tr -dc 'A-Z0-9' | head -c 20)
                SK=$(head -c 96 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 40)
                oc create secret generic versity-root -n $NS \
                  --from-literal=ROOT_ACCESS_KEY_ID="$AK" \
                  --from-literal=ROOT_SECRET_ACCESS_KEY="$SK"
              fi
              # redhat-ods-monitoring is created by the RHOAI operator (DSCI monitoring)
              until oc get secret usage-loki-s3 -n $MON >/dev/null 2>&1 || \
                  oc create secret generic usage-loki-s3 -n $MON \
                    --from-literal=access_key_id="$AK" \
                    --from-literal=access_key_secret="$SK" \
                    --from-literal=bucketnames=loki \
                    --from-literal=endpoint=http://versity.$NS.svc:7070 \
                    --from-literal=region=us-east-1 \
                    --from-literal=forcepathstyle=true; do
                echo "Waiting for namespace $MON..."; sleep 15
              done
              echo "S3 secrets ready"
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
