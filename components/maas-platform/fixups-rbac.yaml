# RBAC for the platform fixups Job (see fixups-job.yaml)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maas-platform-fixups
  namespace: kuadrant-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maas-platform-fixups
  namespace: kuadrant-system
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["kuadrant.io"]
    resources: ["kuadrants"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maas-platform-fixups
  namespace: kuadrant-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maas-platform-fixups
subjects:
  - kind: ServiceAccount
    name: maas-platform-fixups
    namespace: kuadrant-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maas-platform-fixups
  namespace: openshift-operators
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maas-platform-fixups
  namespace: openshift-operators
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maas-platform-fixups
subjects:
  - kind: ServiceAccount
    name: maas-platform-fixups
    namespace: kuadrant-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maas-platform-fixups
  namespace: openshift-ingress
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maas-platform-fixups
  namespace: openshift-ingress
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maas-platform-fixups
subjects:
  - kind: ServiceAccount
    name: maas-platform-fixups
    namespace: kuadrant-system
