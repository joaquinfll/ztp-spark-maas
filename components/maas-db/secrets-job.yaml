# Generates the PostgreSQL password in-cluster (never stored in git) and creates:
#   postgres-creds   (redhat-ods-applications)  POSTGRES_USER / POSTGRES_DB / POSTGRES_PASSWORD
#   maas-db-config   (redhat-ods-applications + redhat-ai-gateway-infra)  DB_CONNECTION_URL
# Idempotent: an existing password is reused, so re-runs never rotate it.
apiVersion: batch/v1
kind: Job
metadata:
  name: maas-db-secrets
  namespace: redhat-ods-applications
spec:
  backoffLimit: 10
  template:
    spec:
      serviceAccountName: maas-db-secrets
      restartPolicy: OnFailure
      containers:
        - name: secrets
          image: quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:c732e0f5ae6b5d4d30062f367f4e10c5590f27c5342142db6eac8dcb6592a7a1
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              NS=redhat-ods-applications
              GW_NS=redhat-ai-gateway-infra
              if oc get secret postgres-creds -n $NS >/dev/null 2>&1; then
                PW=$(oc get secret postgres-creds -n $NS -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d)
                echo "postgres-creds exists - reusing password"
              else
                PW=$(head -c 64 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)
                oc create secret generic postgres-creds -n $NS \
                  --from-literal=POSTGRES_USER=maas \
                  --from-literal=POSTGRES_DB=maas \
                  --from-literal=POSTGRES_PASSWORD="$PW"
              fi
              URL="postgresql://maas:${PW}@postgres.${NS}.svc:5432/maas?sslmode=disable"
              for ns in $NS $GW_NS; do
                oc get secret maas-db-config -n $ns >/dev/null 2>&1 || \
                  oc create secret generic maas-db-config -n $ns --from-literal=DB_CONNECTION_URL="$URL"
              done
              echo "MaaS DB secrets ready"
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
