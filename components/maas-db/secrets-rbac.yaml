# RBAC for the DB secret generator Job (see secrets-job.yaml)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maas-db-secrets
  namespace: redhat-ods-applications
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maas-db-secrets
  namespace: redhat-ods-applications
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maas-db-secrets
  namespace: redhat-ods-applications
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maas-db-secrets
subjects:
  - kind: ServiceAccount
    name: maas-db-secrets
    namespace: redhat-ods-applications
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maas-db-secrets
  namespace: redhat-ai-gateway-infra
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maas-db-secrets
  namespace: redhat-ai-gateway-infra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maas-db-secrets
subjects:
  - kind: ServiceAccount
    name: maas-db-secrets
    namespace: redhat-ods-applications
