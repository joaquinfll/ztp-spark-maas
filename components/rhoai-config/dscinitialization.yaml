apiVersion: dscinitialization.opendatahub.io/v2
kind: DSCInitialization
metadata:
  name: default-dsci
spec:
  applicationsNamespace: redhat-ods-applications
  # metrics/traces start the operator's observability stack in redhat-ods-monitoring
  # (MonitoringStack, ThanosQuerier, Perses, TempoStack, OpenTelemetry Collector).
  # It needs the COO, OpenTelemetry and Tempo operators from the observability-operators
  # app (wave 0). Metrics and traces use PVs on the default StorageClass.
  monitoring:
    managementState: Managed
    namespace: redhat-ods-monitoring
    metrics:
      replicas: 1
      storage:
        size: 5Gi
        retention: 90d
    traces:
      sampleRatio: "0.1"
      storage:
        backend: pv
        retention: 2160h
  trustedCABundle:
    customCABundle: ""
    managementState: Managed
